<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4252"/>
    </marker>
    <pattern id="cells" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="none" stroke="#9aa5b8" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1100" height="600" fill="#ffffff"/>

  <!-- ===================== Panel 1 ===================== -->
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1f2937">① A shape is a hash table read through a decoder that all shapes share</text>
  <text x="30" y="64" font-size="14" fill="#4b5563">The encoding is Instant-NGP's multiresolution hash encoding (Müller et al. 2022, Fig. 3); only the table changes from shape to shape.</text>

  <!-- query point -->
  <circle cx="62" cy="170" r="7" fill="#1f2937"/>
  <text x="62" y="200" font-size="15" text-anchor="middle" fill="#1f2937">x ∈ [−1, 1]³</text>
  <line x1="74" y1="170" x2="118" y2="170" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- grid + hashing -->
  <rect x="122" y="115" width="200" height="110" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
  <text x="222" y="143" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">16 grid levels</text>
  <text x="222" y="165" font-size="13" text-anchor="middle" fill="#374151">resolution 16 → 1024</text>
  <text x="222" y="187" font-size="13" text-anchor="middle" fill="#374151">hash the 8 corners of the</text>
  <text x="222" y="205" font-size="13" text-anchor="middle" fill="#374151">cell around x: h(v) mod 2¹⁰</text>
  <line x1="322" y1="170" x2="368" y2="170" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- hash table T_i -->
  <rect x="367" y="100" width="200" height="140" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="467" y="124" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">hash table Tᵢ of shape i</text>
  <rect x="392" y="134" width="150" height="10" fill="#fde7b5" stroke="#b45309" stroke-width="0.8"/>
  <rect x="392" y="134" width="150" height="10" fill="url(#cells)"/>
  <rect x="392" y="148" width="150" height="10" fill="#fcd98a" stroke="#b45309" stroke-width="0.8"/>
  <rect x="392" y="148" width="150" height="10" fill="url(#cells)"/>
  <text x="467" y="173" font-size="14" text-anchor="middle" fill="#92400e">⋮</text>
  <rect x="392" y="180" width="150" height="10" fill="#f8c45e" stroke="#b45309" stroke-width="0.8"/>
  <rect x="392" y="180" width="150" height="10" fill="url(#cells)"/>
  <text x="467" y="210" font-size="12.5" text-anchor="middle" fill="#78350f">16 levels × 1024 rows × 2 features</text>
  <text x="467" y="228" font-size="12.5" text-anchor="middle" fill="#78350f">= one 16384 × 2 matrix</text>
  <line x1="562" y1="170" x2="608" y2="170" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- interpolate + concat -->
  <rect x="612" y="115" width="180" height="110" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
  <text x="702" y="145" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">interpolate</text>
  <text x="702" y="167" font-size="13" text-anchor="middle" fill="#374151">trilinearly in each level,</text>
  <text x="702" y="186" font-size="13" text-anchor="middle" fill="#374151">concatenate the levels</text>
  <text x="702" y="207" font-size="13" text-anchor="middle" fill="#374151">→ 32 numbers</text>
  <line x1="792" y1="170" x2="838" y2="170" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- shared decoder -->
  <rect x="842" y="115" width="150" height="110" rx="10" fill="#e6f4ea" stroke="#15803d" stroke-width="2"/>
  <text x="917" y="145" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">decoder D</text>
  <text x="917" y="167" font-size="13" text-anchor="middle" fill="#166534">8-layer MLP,</text>
  <text x="917" y="186" font-size="13" text-anchor="middle" fill="#166534">128 wide</text>
  <text x="917" y="207" font-size="13" font-weight="bold" text-anchor="middle" fill="#166534">shared by all shapes</text>
  <line x1="992" y1="170" x2="1030" y2="170" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1062" y="166" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">sᵢ(x)</text>
  <text x="1062" y="186" font-size="12" text-anchor="middle" fill="#4b5563">signed</text>
  <text x="1062" y="201" font-size="12" text-anchor="middle" fill="#4b5563">distance</text>

  <line x1="30" y1="285" x2="1070" y2="285" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ===================== Panel 2 ===================== -->
  <text x="30" y="325" font-size="20" font-weight="bold" fill="#1f2937">② A rotation is one matrix W that acts on the table</text>
  <text x="30" y="349" font-size="14" fill="#4b5563">The decoder and the tables are frozen; only W is trained. The hope: the same W rotates shapes it never saw, and W² rotates by 180°.</text>

  <!-- T_i small -->
  <rect x="40" y="385" width="170" height="110" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="125" y="412" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">Tᵢ</text>
  <rect x="60" y="424" width="130" height="10" fill="#fde7b5" stroke="#b45309" stroke-width="0.8"/>
  <rect x="60" y="424" width="130" height="10" fill="url(#cells)"/>
  <rect x="60" y="438" width="130" height="10" fill="#f8c45e" stroke="#b45309" stroke-width="0.8"/>
  <rect x="60" y="438" width="130" height="10" fill="url(#cells)"/>
  <text x="125" y="474" font-size="12.5" text-anchor="middle" fill="#78350f">table of shape i</text>
  <line x1="210" y1="440" x2="268" y2="440" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- W -->
  <rect x="272" y="375" width="230" height="130" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="387" y="405" font-size="17" font-weight="bold" text-anchor="middle" fill="#581c87">T′ᵢ = Wᵀ Tᵢ</text>
  <text x="387" y="430" font-size="13" text-anchor="middle" fill="#6b21a8">W: 16384 × 16384</text>
  <text x="387" y="449" font-size="13" text-anchor="middle" fill="#6b21a8">(268 million numbers)</text>
  <text x="387" y="471" font-size="13" font-weight="bold" text-anchor="middle" fill="#6b21a8">one W for every shape</text>
  <text x="387" y="490" font-size="12" text-anchor="middle" fill="#6b21a8">W² = W·W for 180°</text>
  <line x1="502" y1="440" x2="560" y2="440" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T~ -->
  <rect x="564" y="385" width="170" height="110" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="649" y="412" font-size="15" font-weight="bold" text-anchor="middle" fill="#831843">T′ᵢ</text>
  <rect x="584" y="424" width="130" height="10" fill="#fbcfe8" stroke="#9d174d" stroke-width="0.8"/>
  <rect x="584" y="424" width="130" height="10" fill="url(#cells)"/>
  <rect x="584" y="438" width="130" height="10" fill="#f9a8d4" stroke="#9d174d" stroke-width="0.8"/>
  <rect x="584" y="438" width="130" height="10" fill="url(#cells)"/>
  <text x="649" y="474" font-size="12.5" text-anchor="middle" fill="#831843">transformed table</text>
  <line x1="734" y1="440" x2="792" y2="440" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- same decoder -->
  <rect x="796" y="385" width="150" height="110" rx="10" fill="#e6f4ea" stroke="#15803d" stroke-width="2"/>
  <text x="871" y="415" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">decoder D</text>
  <text x="871" y="438" font-size="13" text-anchor="middle" fill="#166534">the same one,</text>
  <text x="871" y="457" font-size="13" text-anchor="middle" fill="#166534">frozen</text>
  <text x="871" y="478" font-size="12.5" text-anchor="middle" fill="#166534">(plus interpolation)</text>
  <line x1="946" y1="440" x2="984" y2="440" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1034" y="428" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">should equal</text>
  <text x="1034" y="447" font-size="13" text-anchor="middle" fill="#1f2937">shape i turned</text>
  <text x="1034" y="466" font-size="13" text-anchor="middle" fill="#1f2937">90° about y</text>

  <!-- loss note -->
  <text x="40" y="545" font-size="13.5" fill="#374151">Training signal: SDF samples of the rotated mesh, compared with what D reads from T′ᵢ (MAPE loss). Nothing compares tables directly.</text>
  <text x="40" y="568" font-size="13.5" fill="#374151">Tᵢ and D come from stage ① trained on each mesh and its rotated copy; W is fitted on about 25 such pairs.</text>
</svg>
